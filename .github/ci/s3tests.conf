[DEFAULT]
host = localhost
port = 9710
is_secure = False

[fixtures]
bucket prefix = wdtest-{random}-

# CI has one user, the admin. Every section below uses the same
# credentials, as in docs/TEST-COVERAGE.md's recipe for running this suite.
# So cross-user tests aren't enabled (see s3-compat-enabled.txt).
#
# display_name must match the server's WARPDRIVE_ADMIN_DISPLAY_NAME (set in
# the workflow), and user_id must match the admin's canonical ID, which is
# always "admin" (s3/auth.rs ADMIN_USER_ID). If either differs, tests that
# compare owner names or IDs fail even though the server behaves correctly.

[s3 main]
# Lifecycle "days" in seconds, as the server's WARPDRIVE_LIFECYCLE_DEBUG_DAY_SECS
# (set in the workflow).
lc_debug_interval = 2
display_name = Warpdrive Admin
user_id = admin
email = admin@warpdrive.test
access_key = AKIAIOSFODNN7EXAMPLE
secret_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

[s3 alt]
display_name = Warpdrive Admin
user_id = admin
email = admin-alt@warpdrive.test
access_key = AKIAIOSFODNN7EXAMPLE
secret_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

[s3 tenant]
display_name = Warpdrive Admin
user_id = admin
email = admin-tenant@warpdrive.test
access_key = AKIAIOSFODNN7EXAMPLE
secret_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
tenant = testtenant

[iam]
display_name = Warpdrive Admin
user_id = admin
email = admin-iam@warpdrive.test
access_key = AKIAIOSFODNN7EXAMPLE
secret_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

[iam root]
access_key = AKIAIOSFODNN7EXAMPLE
secret_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
user_id = admin
email = admin-iamroot@warpdrive.test
display_name = Warpdrive Admin

[iam alt root]
access_key = AKIAIOSFODNN7EXAMPLE
secret_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
user_id = admin
email = admin-iamaltroot@warpdrive.test
