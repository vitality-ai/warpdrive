
name: testcase-workflow

on:
  pull_request:
    branches: [ "main" ]
  # A merge can combine two branches that each passed on their own into
  # something neither PR's run tested, so every push to main runs too.
  push:
    branches: [ "main" ]
  # Manual run: the S3 compatibility job runs the full suite and reports
  # which tests are ready to enable, without failing.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Python client tests
  client-tests:
    name: Client tests

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flatbuffers pytest requests flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Init submodules
      run: git submodule update --init --recursive
      
    - name: Test with pytest
      working-directory: client/python-sdk
      run: |
        pytest ciaos/test.py

  # Builds the release server once per run. The S3 compatibility, STS and
  # Jepsen jobs download this binary instead of each compiling their own.
  build-server:
    name: Build server (release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: server

    - name: Build release binary
      working-directory: server
      run: cargo build --release --locked --bin warp_drive

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: warp_drive-release
        path: server/target/release/warp_drive
        if-no-files-found: error
        retention-days: 1

  # S3 compatibility suite: the Ceph project's s3-tests, forked into
  # vitality-ai/s3-tests and pinned to a commit. Upstream ceph/s3-tests
  # moved into ceph/ceph and is no longer maintained, so the fork is a
  # stable copy.
  #
  # Runs against a 5-node RS(3,2) cluster on this runner, since the
  # distributed engine is what ships. The suite talks to node 0 on the
  # root-form S3 routes (it has no setting for a URL prefix like /s3).
  #
  # On a PR, only the tests in .github/ci/s3-compat-enabled.txt run, and
  # every one must pass. A feature PR enables its tests by adding them to
  # that file. A manual run (workflow_dispatch) runs the full suite and
  # lists the passing tests that aren't enabled yet. It never fails.
  s3-compatibility-tests:
    name: S3 compatibility suite (5-node cluster)
    needs: build-server
    runs-on: ubuntu-latest
    env:
      WARPDRIVE_ADMIN_ACCESS_KEY: AKIAIOSFODNN7EXAMPLE
      WARPDRIVE_ADMIN_SECRET_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      WARPDRIVE_ADMIN_DISPLAY_NAME: Warpdrive Admin
      # Lifecycle "days" of 10 s, the suite's lc_debug_interval (test only).
      WARPDRIVE_LIFECYCLE_DEBUG_DAY_SECS: "10"
    steps:
    - uses: actions/checkout@v4

    - name: Download server binary
      uses: actions/download-artifact@v4
      with:
        name: warp_drive-release
        path: server/target/release

    # Artifacts don't keep the executable bit.
    - run: chmod +x server/target/release/warp_drive

    - name: Start a 5-node RS(3,2) cluster
      run: .github/ci/start_cluster.sh server/target/release/warp_drive "$RUNNER_TEMP/cluster"

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Clone S3 compatibility suite (pinned)
      run: |
        git clone https://github.com/vitality-ai/s3-tests.git s3-tests
        cd s3-tests
        git checkout 5b3987116eca0b4b8fa57d6b10f3db57bab196b6

    - name: Install s3-tests
      working-directory: s3-tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run suite
      working-directory: s3-tests
      env:
        S3COMPAT_RUN_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      # pytest exits non-zero whenever a test fails. The next step decides
      # red or green, so this step doesn't.
      #
      # s3tests_enabled_only: run only the enabled tests (all of them when
      # S3COMPAT_RUN_ALL=1). s3tests_tolerant_cleanup: one bucket the suite
      # can't delete doesn't make every later test error (see its docstring).
      run: |
        cp ../.github/ci/s3tests.conf .
        PYTHONPATH=../.github/ci S3TEST_CONF=s3tests.conf python -m pytest \
          -p s3tests_enabled_only -p s3tests_tolerant_cleanup \
          s3tests/functional/test_s3.py s3tests/functional/test_headers.py \
          -q --junitxml=results.xml || true

    - name: Check results
      if: always()
      working-directory: s3-tests
      run: |
        if [ "${{ github.event_name }}" = workflow_dispatch ]; then
          python3 ../.github/ci/check_s3_compat.py results.xml --discover
        else
          python3 ../.github/ci/check_s3_compat.py results.xml
        fi

    - name: Upload results and node logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: s3-compatibility-results
        path: |
          s3-tests/results.xml
          ${{ runner.temp }}/cluster/node*/node.out
          ${{ runner.temp }}/cluster/node*/logs/application.log

  # Rust server tests
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: server
    # cargo test builds everything it needs, so there's no separate build step.
    - name: Run server tests
      working-directory: server
      run: cargo test

  # External-IAM federation: AssumeRoleWithWebIdentity against a real
  # Keycloak container, with an unmodified boto3 STS client -- not a
  # mocked/self-signed-token substitute. Separate job (not folded into
  # server-tests) since it stands up its own Docker service and has a
  # materially different failure mode (an IdP-integration regression,
  # not a Rust unit-test regression).
  sts-oidc-tests:
    name: STS/OIDC federation tests (Keycloak)
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Download server binary
      uses: actions/download-artifact@v4
      with:
        name: warp_drive-release
        path: server/target/release

    # Artifacts don't keep the executable bit.
    - run: chmod +x server/target/release/warp_drive

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install Python test dependencies
      run: pip install -r server/tests/python/requirements.txt

    - name: Start Keycloak
      run: |
        docker run -d --name keycloak -p 8080:8080 \
          -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
          quay.io/keycloak/keycloak:latest start-dev

        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/realms/master/.well-known/openid-configuration > /dev/null; then
            echo "Keycloak is up"
            exit 0
          fi
          sleep 2
        done
        echo "Keycloak did not become ready in time"
        docker logs keycloak
        exit 1

    - name: Start WarpDrive (OIDC-federated)
      # Runs from server/ because log4rs::init_file loads "server_log.yaml"
      # via a relative path, which only resolves from that directory.
      working-directory: server
      run: |
        WARPDRIVE_PORT=9710 \
        WARPDRIVE_STORAGE_PATH=/tmp/warpdrive_sts_ci_storage \
        WARPDRIVE_OIDC_ISSUER="http://localhost:8080/realms/warpdrive" \
        WARPDRIVE_OIDC_AUDIENCE="warpdrive-client" \
        WARPDRIVE_OIDC_JWKS_URL="http://localhost:8080/realms/warpdrive/protocol/openid-connect/certs" \
        WARPDRIVE_OIDC_USER_CLAIM="sub" \
        WARPDRIVE_OIDC_BUCKETS_CLAIM="buckets" \
        WARPDRIVE_OIDC_DEFAULT_BUCKETS="sts-tenant-default" \
          ./target/release/warp_drive &
        for i in $(seq 1 15); do
          curl -sf http://localhost:9710/ > /dev/null && exit 0
          sleep 1
        done
        echo "WarpDrive did not become ready in time"
        exit 1

    - name: Run STS/OIDC round-trip tests
      run: python3 server/tests/python/sts_oidc_test.py

  # Jepsen/Elle DST, defined in jepsen-dst.yml. On a PR it runs from here so
  # it can use the binary from build-server.
  jepsen-dst:
    needs: build-server
    uses: ./.github/workflows/jepsen-dst.yml
    with:
      prebuilt-binary: true
