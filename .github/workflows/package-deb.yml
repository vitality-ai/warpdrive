name: package-deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release binary
        working-directory: server
        run: cargo build --release --bin warp_drive

      - name: Build .deb package
        working-directory: server
        # A static revision (cargo-deb's default "1") means every push to
        # main that doesn't also bump Cargo.toml's version builds a .deb
        # under the exact same Debian version string. Two real problems
        # with that, not just one: reprepro correctly refuses to silently
        # swap one version's published bytes for another's (what actually
        # happened: 2026-10-?? CI run, "Already existing files can only be
        # included again, if they are the same" -- a real safety check,
        # not a flake), and even without that failure, a frozen version
        # string means `apt-get upgrade` would never see a rebuilt package
        # as newer and silently never update anyone already on it. The
        # commit count always increases, so every real commit gets its own
        # version and apt's upgrade detection works correctly going forward.
        run: cargo deb --no-build --deb-revision "$(git rev-list --count HEAD)"

      - name: Upload .deb as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: warpdrive-deb
          path: server/target/debian/*.deb

      # Publishing to the apt repo (gh-pages: pool/, dists/, conf/) signs the
      # Release file with the key conf/distributions' SignWith names, using
      # the repo's existing GPG_PRIVATE_KEY/GPG_PASSPHRASE/GPG_KEY_ID
      # secrets. The key is passphrase-protected, so reprepro (which shells
      # out to gpg internally, with no terminal to prompt on) needs the
      # passphrase preset into a running gpg-agent via gpg-preset-passphrase
      # before it runs, rather than supplied some other way.
      - name: Publish to apt repo
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -e
          sudo apt-get install -y reprepro gnupg
          export GNUPGHOME="$(mktemp -d)"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-preset-passphrase" >> "$GNUPGHOME/gpg-agent.conf"
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          KEYGRIP=$(gpg --with-keygrip --list-secret-keys "$GPG_KEY_ID" | awk '/Keygrip/ {print $3; exit}')
          GPG_LIBEXEC="$(gpgconf --list-dirs libexecdir)"
          "$GPG_LIBEXEC/gpg-preset-passphrase" --preset "$KEYGRIP" <<< "$GPG_PASSPHRASE"

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages-publish origin/gh-pages
          cp server/target/debian/*.deb /tmp/gh-pages-publish/
          cd /tmp/gh-pages-publish
          DEB_FILE=$(ls *.deb)
          # Rust builds aren't bit-for-bit reproducible by default (embedded
          # paths/timestamps), so a workflow re-run on the same commit --
          # same version string by design, see the build step's comment --
          # can still produce different bytes. `remove` first (a no-op if
          # this version was never published) makes this step idempotent
          # under a re-run instead of hitting the same collision error.
          reprepro -b . remove stable warpdrive || true
          reprepro -b . includedeb stable "$DEB_FILE"
          rm -f "$DEB_FILE"
          git add pool dists db
          if git diff --cached --quiet; then
            echo "No apt repo changes (package unchanged); nothing to publish."
            exit 0
          fi
          git -c user.name="warpdrive-ci" -c user.email="ci@vitality-ai.github" \
            commit -m "Publish $DEB_FILE to apt repo (${{ github.sha }})"
          git push origin HEAD:gh-pages
