# This workflow will builds rust dependencies and uses clippy for linting
name: test-build-deploy-workflow

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read  

jobs:
  test_and_lint:    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: clippy

    - name: Build project
      working-directory: server
      run: cargo build

    - name: Run unit tests
      working-directory: server
      run: cargo test

    - name: Lint with Clippy (Errors Only)
      working-directory: server
      run: |
        cargo clippy -- -A warnings  # report only errors

  docker_publish_ghcr:
    needs: test_and_lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image to ghcr
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/warpdrive:latest
          ghcr.io/${{ github.repository_owner }}/warpdrive:${{ github.sha }}

  docker_publish_dockerhub:
    needs: test_and_lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
    - uses: actions/checkout@v4

    # Skipped entirely (not a failure) until DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
    # are added as repo secrets (Settings -> Secrets and variables ->
    # Actions): a Docker Hub account + repo named "warpdrive", and an
    # access token with Read & Write scope from Account Settings ->
    # Security -> Access Tokens.
    - name: Log in to Docker Hub
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image to Docker Hub
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          docker.io/${{ secrets.DOCKERHUB_USERNAME }}/warpdrive:latest
          docker.io/${{ secrets.DOCKERHUB_USERNAME }}/warpdrive:${{ github.sha }}

  deploy:
    needs: [docker_publish_ghcr, docker_publish_dockerhub]
    runs-on: ubuntu-latest

    steps:
    - name: POST request to re-deploy on portainer webhook
      run: |
        curl -X POST https://docker.cialabs.org/api/stacks/webhooks/4e3fb43a-54dc-459a-be5a-36988796405e?BUILD_HASH=${{ github.sha }} -H "Content-Type: application/json"
