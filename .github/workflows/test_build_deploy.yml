# This workflow will builds rust dependencies and uses clippy for linting
name: test-build-deploy-workflow

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read  

jobs:
  test_and_lint:    
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: clippy

    - name: Build project
      working-directory: server
      run: cargo build

    - name: Run unit tests
      working-directory: server
      run: cargo test

    - name: Lint with Clippy (Errors Only)
      working-directory: server
      run: |
        cargo clippy -- -A warnings  # report only errors

  # Docker Hub is the one published image (docs and homepage point only at
  # it). Each architecture builds natively on its own runner and pushes by
  # digest. docker_publish_dockerhub then joins the digests into one
  # multi-arch tag, so `docker pull` picks amd64 or arm64 by itself.
  # QEMU emulation would avoid the second runner, but a release cargo build
  # under QEMU takes far longer than a native one.
  #
  # Every step is skipped (not failed) until DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN are added as repo secrets (Settings -> Secrets and
  # variables -> Actions): a Docker Hub account + repo named "warpdrive",
  # and an access token with Read & Write scope from Account Settings ->
  # Security -> Access Tokens.
  docker_build_dockerhub:
    needs: test_and_lint
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    env:
      DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: docker/setup-buildx-action@v3

    - name: Build and push ${{ matrix.platform }} by digest
      id: build
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/warpdrive,push-by-digest=true,name-canonical=true,push=true

    - name: Save digest
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    - name: Upload digest
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: digest-${{ strategy.job-index }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  docker_publish_dockerhub:
    needs: docker_build_dockerhub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
    - name: Download digests
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digest-*
        merge-multiple: true

    - name: Log in to Docker Hub
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      uses: docker/setup-buildx-action@v3

    - name: Tag multi-arch image as latest and commit SHA
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      working-directory: ${{ runner.temp }}/digests
      env:
        IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/warpdrive
      run: |
        # One digest file per architecture, named by its sha256.
        sources=()
        for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
        docker buildx imagetools create \
          -t "$IMAGE:latest" \
          -t "$IMAGE:${GITHUB_SHA}" \
          "${sources[@]}"

    - name: Check both architectures are in the tag
      if: ${{ env.DOCKERHUB_TOKEN_SET == 'true' }}
      env:
        IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/warpdrive
      run: |
        docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}" | tee inspect.txt
        grep -q 'linux/amd64' inspect.txt
        grep -q 'linux/arm64' inspect.txt
