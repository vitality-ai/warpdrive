[package]
name = "warp_drive"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.11.0"
bincode = "1.3.3"
bytes = "1.7.2"
env_logger = "0.11.5"
flatbuffers = "24.3.25"
futures = "0.3.30"
lazy_static = "1.5.0"
log = "0.4.22"
rusqlite = "0.32.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.128"
log4rs = "1.3.0"
log-mdc = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
md5 = "0.7.0"
hex = "0.4.3"
sha2 = "0.10"
sha1 = "0.10"
crc32fast = "1"
crc = "3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
hmac = "0.12"
base64 = "0.22"
reed-solomon-erasure = "6.0"
async-trait = "0.1"
tonic = "0.11"
prost = "0.12"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3"

[dev-dependencies]
actix-web = "4.11.0"
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "ec_bench"
harness = false

[[bin]]
name = "transport_bench"
path = "src/bin/transport_bench.rs"

[[bin]]
name = "load_gen"
path = "src/bin/load_gen.rs"

[[bin]]
name = "fanout_bench"
path = "src/bin/fanout_bench.rs"
