[package]
name = "warp_drive"
version = "0.1.0"
edition = "2021"
description = "WarpDrive is an S3-ish rocket engine optimised for ML/Database workloads but also general purpose"

[dependencies]
actix-web = "4.11.0"
bincode = "1.3.3"
bytes = "1.7.2"
env_logger = "0.11.5"
flatbuffers = "24.3.25"
futures = "0.3.30"
lazy_static = "1.5.0"
log = "0.4.22"
rusqlite = "0.32.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.128"
log4rs = "1.3.0"
log-mdc = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
md5 = "0.7.0"
hex = "0.4.3"
sha2 = "0.10"
sha1 = "0.10"
crc32fast = "1"
crc = "3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
actix-web = "4.11.0"

[package.metadata.deb]
name = "warpdrive"
maintainer = "Tejas ChandraShekarRaju <tchandrashekar@acm.org>"
license-file = ["../LICENSE"]
extended-description = """\
Warpdrive is a self-hosted S3-compatible object storage server.
Drop-in replacement for AWS S3 — works with any S3 SDK out of the box."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  ["target/release/warp_drive", "usr/bin/warpdrive", "755"],
  ["../packaging/warpdrive.env", "etc/warpdrive/warpdrive.env", "640"],
  ["server_log.yaml",            "etc/warpdrive/warpdrive.yaml", "644"],
]
maintainer-scripts = "../packaging/debian/"
systemd-units = { unit-name = "warpdrive", enable = true }
