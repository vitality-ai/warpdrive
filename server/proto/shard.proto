// Inter-node shard transport over gRPC — the alternative PeerClient
// implementation benchmarked head-to-head against plain HTTP in the
// transport decision point (docs/Distributed-Engine-Plan.md). The shard
// payload is a plain `bytes` field: gRPC's own protobuf framing already
// gives structure (bucket/key/shard_idx + payload), so there's nothing
// left for FlatBuffers to add here, unlike the HTTP path where it reuses
// the native API's existing wire format.
syntax = "proto3";
package warpdrive.cluster;

service ShardService {
  rpc PutShard(PutShardRequest) returns (PutShardResponse);
  rpc GetShard(GetShardRequest) returns (GetShardResponse);
}

message PutShardRequest {
  string bucket = 1;
  string key = 2;
  uint32 shard_idx = 3;
  bytes data = 4;
  // Tenant-isolation fix: empty string means the unauthenticated/legacy
  // namespace (see location_store::UNAUTHENTICATED_USER), not a protocol
  // version gap -- every caller sets this explicitly, proto3's own
  // default-empty-string behavior is never relied on to mean anything.
  string user_id = 5;
}

message PutShardResponse {}

message GetShardRequest {
  string bucket = 1;
  string key = 2;
  uint32 shard_idx = 3;
  string user_id = 4;
  // Optional byte sub-range within the shard. length == 0 means "whole shard"
  // (offset ignored), preserving the original whole-shard fetch. A non-zero
  // length reads only [offset, offset+length) of the stored shard, so a plain
  // range-GET fetches just the bytes its byte-range overlaps instead of every
  // whole positional shard it spans.
  uint64 offset = 5;
  uint64 length = 6;
}

message GetShardResponse {
  bytes data = 1;
}
