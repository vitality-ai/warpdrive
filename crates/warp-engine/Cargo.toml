[package]
name = "warp-engine"
version = "0.1.0"
edition = "2021"
description = "WarpDrive's distributed engine interface: opaque rows and blobs, ordered, replicated and durable, with no knowledge of objects"
publish = false

[dependencies]
warp-meta-store = { path = "../warp-meta-store" }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"

[dev-dependencies]
serde_json = "1.0"
rmp-serde = "1.3"
