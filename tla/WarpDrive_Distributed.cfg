SPECIFICATION Spec

CONSTANTS
    Peers = {"p1", "p2", "p3"}
    Buckets = {"b1"}
    Keys = {"k1", "k2"}
    Data = {"d1", "d2"}
    RetentionModes = {"NONE", "GOVERNANCE", "COMPLIANCE"}
    K = 1
    M = 1
    MaxClock = 2

INVARIANTS
    TypeOK
    DataConsistency
    QuorumWasMet
    PlacementPinSubsetOfKnownPeers
    Consistent

PROPERTIES
    ComplianceIsUndeletable
    JoinNeverMutatesRecords

\* K = M = 1 matches the minimum viable EC config actually used in this
\* project's real GCP experiments (server/src/cluster/ec.rs rejects
\* k == 0 or m == 0), so WriteQuorum here is 2 (K+1, since M = K) and
\* ReadQuorum is 1. Kept this small on purpose: 3 peers, 1 bucket, 2 keys,
\* 2 data values, clock bound 2 is already enough state space to exercise
\* join / crash / recover / put / update / delete / retention, and small
\* enough for TLC to finish quickly. Widen once this runs clean.

\* For an even smaller first run while checking the spec itself parses
\* and the actions are not vacuously disabled, restrict the action set:
\* ACTION_CONSTRAINT Put \/ Get \/ Delete
